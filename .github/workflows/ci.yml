name: CI

on:
  push:
    branches:
      - main
      - feat/local-ai-studio
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avenlyo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avenlyo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/avenlyo_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenlyo_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Bootstrap database roles
        run: npm run db:bootstrap

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
